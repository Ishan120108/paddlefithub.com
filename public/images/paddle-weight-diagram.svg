<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <rect width="600" height="220" fill="#fafafa" rx="8" />
  <g transform="translate(30, 40)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#171717">Light (7.0–7.4 oz)</text>
    <text x="80" y="60" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#888888">Fast Net Hands</text>
    <text x="80" y="80" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#c50000">Higher Recoil Shock</text>
  </g>
  <g transform="translate(220, 40)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#29bc9b">Mid (7.5–8.0 oz) ⭐</text>
    <text x="80" y="60" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#888888">Optimal Balance</text>
    <text x="80" y="80" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#0761d1">Best Joint Protection</text>
  </g>
  <g transform="translate(410, 40)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#171717">Heavy (8.1–8.5+ oz)</text>
    <text x="80" y="60" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#888888">Max Drive Power</text>
    <text x="80" y="80" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" fill="#ab570a">Higher Shoulder Load</text>
  </g>
  <text x="300" y="185" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="500" fill="#171717">Figure 1: Static Weight Category Tradeoffs (PaddleFitHub Lab Data)</text>
</svg>
